[project]
name = "pikaraoke"
version = "1.14.1"
description = "Youtube-based Karaoke machine for Raspberry Pi, OSX, Windows, and Linux"
authors = [
    {name = "Vic Wong"}
]
readme = "docs/README.md"
requires-python = ">=3.10"
keywords = ["karaoke", "ktv", "video", "audio", "youtube", "raspberry-pi", "osx", "windows", "linux"]
classifiers = [
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Games/Entertainment"
]
dependencies = [
    "CherryPy==18.10.0",
    "Flask>=3.0.0,<4.0.0",
    "qrcode==7.4.2",
    "psutil==6.0.0",
    "requests==2.32.4",
    "jinja2==3.1.6",
    "selenium==4.21.0",
    "ffmpeg-python==0.2.0",
    "yt-dlp[default]>=2025.11.12",
    "flask-socketio>=5.5.0,<6.0.0",
    "gevent>=24.11.1,<25.0.0",
    "python-socketio>=5.11.0,<6.0.0",
    "flask-babel>=4.0.0",
    "flask-paginate>=2024.4.12",
    "babel>=2.17.0",
]

[project.urls]
Homepage = "https://github.com/vicwomg/pikaraoke"
Repository = "https://github.com/vicwomg/pikaraoke"

[project.scripts]
pikaraoke = "pikaraoke.app:main"
pikaraoke-setup = "pikaraoke.setup_apt:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pre-commit>=3.7.1,<4.0.0",
    "pytest>=8.3.2,<9.0.0",
]
